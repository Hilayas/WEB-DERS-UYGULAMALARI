<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <link rel="stylesheet" href="css/2211011066.css">
    <script type="module" src="js/event-form.js"></script>
    <style>
      [aria-invalid="true"] {
        border-color: #d9534f !important;
        background-color: #fff8f8;
      }
      .hata-mesaj {
        color: #d9534f;
        font-size: 0.85rem;
        display: block;
        margin-top: 0.3rem;
        min-height: 1.2rem;
      }
      .form-grup {
        margin-bottom: 1.2rem;
        display: flex;
        flex-direction: column;
      }
      .form-grup label {
        font-weight: 600;
        margin-bottom: 0.4rem;
      }
      .form-grup input, .form-grup select, .form-grup textarea {
        padding: 0.6rem 0.8rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
        font-family: inherit;
      }
      .basari-kutusu {
        border: 2px solid #2e7d32;
        background-color: #f1f8e9;
        color: #1b5e20;
        padding: 1.2rem;
        border-radius: 8px;
        margin-top: 1.5rem;
      }
      .basari-kutusu pre {
        background: #fff;
        padding: 1rem;
        border-radius: 4px;
        border: 1px solid #c8e6c9;
        overflow-x: auto;
        font-family: monospace;
        color: #333;
        margin-top: 0.8rem;
      }
    </style>
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
        <section id="form-alani">
            <p id="bilgi-notu" style="color: #555; margin-bottom: 1.5rem;">
                Alanlar mevcut etkinliğin bilgileriyle dolu gelir. Bu sprintte form veri güncellemez.
            </p>

            <form id="etkinlik-formu" data-mode="guncelle" novalidate>
                <div class="form-grup">
                    <label for="ad">Etkinlik Adı *</label>
                    <input type="text" id="ad" name="ad">
                    <span id="hata-ad" class="hata-mesaj"></span>
                </div>

                <div class="form-grup">
                    <label for="kategori">Kategori *</label>
                    <select id="kategori" name="kategori">
                        <option value="">Seçiniz</option>
                        <option value="Seminer">Seminer</option>
                        <option value="Atölye">Atölye</option>
                        <option value="Söyleşi">Söyleşi</option>
                    </select>
                    <span id="hata-kategori" class="hata-mesaj"></span>
                </div>

                <div class="form-grup">
                    <label for="tarih">Tarih *</label>
                    <input type="date" id="tarih" name="tarih">
                    <span id="hata-tarih" class="hata-mesaj"></span>
                </div>

                <div class="form-grup">
                    <label for="saat">Saat *</label>
                    <input type="time" id="saat" name="saat">
                    <span id="hata-saat" class="hata-mesaj"></span>
                </div>

                <div class="form-grup">
                    <label for="yer">Yer *</label>
                    <input type="text" id="yer" name="yer">
                    <span id="hata-yer" class="hata-mesaj"></span>
                </div>

                <div class="form-grup">
                    <label for="kontenjan">Kontenjan</label>
                    <input type="number" id="kontenjan" name="kontenjan">
                    <span id="hata-kontenjan" class="hata-mesaj"></span>
                </div>

                <div class="form-grup">
                    <label for="aciklama">Açıklama</label>
                    <textarea id="aciklama" name="aciklama" rows="4"></textarea>
                    <span id="hata-aciklama" class="hata-mesaj"></span>
                </div>

                <button type="submit" style="padding: 0.75rem 2rem; background: var(--renk-ana, #1b7340); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                    Güncelle
                </button>
            </form>

            <div id="form-mesaj"></div>
        </section>
    </main>

    <footer style="margin-top: 2rem; border-top: 1px solid #ccc; padding-top: 1rem;">
        <p>Hilal Aslan - 2211011066</p>
    </footer>
</body>
</html>
